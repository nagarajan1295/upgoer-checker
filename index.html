<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Up-Goer check</title>
<style>
  :root { --paper:#ffffff; --ink:#111418; --soft:#6a717c; --rule:#e6e8ec; --red:#d92d20; --mark:rgba(217,45,32,.12); --amber:#b54708; --hit:#fde4e1; --panel:#ffffff; --shadow:0 8px 28px rgba(0,0,0,.12); }
  :root[data-theme="dark"] { --paper:#0e1115; --ink:#eceff3; --soft:#959dab; --rule:#262b33; --red:#ff6b5e; --mark:rgba(255,107,94,.22); --amber:#f5a524; --hit:#3a1613; --panel:#171b21; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--paper); color:var(--ink); font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; display:flex; flex-direction:column; }
  body.hit { animation: hit .5s ease-out; }
  @keyframes hit { 0% { background:var(--hit); } 100% { background:var(--paper); } }

  .bar { display:flex; align-items:baseline; gap:22px; padding:16px 36px; border-bottom:1px solid var(--rule); font-size:15px; }
  .bar .title { font-weight:700;  font-size:19px; margin-right:auto; }
  .bar label { color:var(--soft); cursor:pointer; user-select:none; }
  .bar input[type=checkbox] { accent-color:var(--ink); margin-right:6px; }
  .bar button { font:inherit; background:none; border:0; color:var(--soft); cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:3px; }
  .bar button:hover { color:var(--ink); }

  main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 36px; min-height:0; }
  #status {  font-size:clamp(26px,3.6vw,46px); color:var(--soft); line-height:1.2; }
  #status.live { color:var(--ink); }
  #status { font-weight:600; letter-spacing:-.02em; } #status.flag { color:var(--red); font-weight:800; font-size:clamp(64px,13vw,190px); line-height:1; letter-spacing:-.01em; }
  #status .note { display:block; font-weight:400;  font-size:clamp(16px,1.8vw,22px); color:var(--soft); margin-top:14px; letter-spacing:0; }

  #go { margin-top:26px; align-self:flex-start; font:inherit; font-size:17px; padding:11px 26px; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper); border-radius:8px; font-weight:600; cursor:pointer; }
  #go.on { background:none; color:var(--ink); }
  #msg { color:var(--amber); font-size:15px; margin-top:14px; min-height:20px; max-width:720px; }

  footer { border-top:1px solid var(--rule); padding:16px 36px 20px; }
  #fixes { font-size:15px; color:var(--soft); margin-bottom:8px; min-height:22px; }
  #fixes b { color:var(--red); font-weight:600; }
  #transcript { font-weight:500; height:24vh; overflow-y:auto;  font-size:clamp(22px,2.5vw,34px); line-height:1.55; }
  .bad { background:var(--mark); color:var(--red); font-weight:600; border-radius:3px; padding:0 3px; }
  body[data-hl="underline"] .bad { background:none; text-decoration:underline wavy var(--red); text-decoration-thickness:2px; text-underline-offset:6px; }
  body[data-hl="box"] .bad { background:var(--red); color:var(--paper); border-radius:5px; padding:0 7px; }
  body[data-hl="color"] .bad { background:none; }
  .form { border-bottom:1px dotted var(--amber); }
  .interim { color:var(--soft); }
  .interim.bad { color:var(--red); }
  body[data-hl="box"] .interim.bad { color:var(--paper); opacity:.8; }
  #typed { margin-top:10px; display:flex; gap:12px; }
  #typed input { flex:1; font:inherit; font-size:15px; padding:6px 0; border:0; border-bottom:1px solid var(--rule); background:none; color:var(--ink); outline:none; }
  #typed input:focus { border-bottom-color:var(--ink); }
  #typed button { font:inherit; font-size:15px; background:none; border:0; color:var(--soft); cursor:pointer; }
  .wrap { position:relative; }
  #panel { display:none; position:absolute; right:0; top:30px; z-index:5; width:330px; background:var(--panel); border:1px solid var(--rule); border-radius:12px; box-shadow:var(--shadow); padding:16px 18px; }
  #panel.open { display:block; max-height:84vh; overflow-y:auto; }
  #panel .pb { text-decoration:none; border:1px solid var(--rule); border-radius:8px; padding:7px 12px; color:var(--ink); width:100%; }
  #diag { margin-top:10px; font-size:13px; line-height:1.4; }
  #diag .sum { font-weight:600; margin-bottom:8px; font-size:14px; }
  #diag .it { padding:7px 0; border-top:1px solid var(--rule); display:flex; gap:9px; }
  #diag .dot { flex:none; width:9px; height:9px; border-radius:50%; margin-top:5px; background:var(--soft); }
  #diag .ok .dot { background:#1a9d55; } #diag .warn .dot { background:#e0a400; } #diag .fail .dot { background:var(--red); }
  #diag .nm { font-weight:600; } #diag .fx { color:var(--soft); margin-top:2px; }
  #diag .meter { height:6px; background:var(--rule); border-radius:3px; margin-top:5px; overflow:hidden; }
  #diag .meter i { display:block; height:100%; width:0; background:#1a9d55; }
  #panel h3 { margin:0 0 6px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); font-weight:600; }
  #panel .grp { margin-bottom:16px; }
  #panel .grp:last-child { margin-bottom:0; }
  .seg { display:flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden; }
  .seg button { flex:1; text-decoration:none; padding:7px 4px; font-size:14px; color:var(--soft); border-right:1px solid var(--rule); }
  .seg button:last-child { border-right:0; }
  .seg button.sel { background:var(--ink); color:var(--paper); }
  #panel select { flex:1; font:inherit; font-size:14px; padding:6px; background:var(--paper); color:var(--ink); border:1px solid var(--rule); border-radius:8px; }
  #panel input[type=range] { width:100%; accent-color:var(--ink); }
  #panel .row { display:flex; gap:10px; align-items:center; }
  #panel .row button { text-decoration:none; border:1px solid var(--rule); border-radius:8px; padding:6px 12px; white-space:nowrap; color:var(--ink); }
  #status .alt { display:block; font-weight:500; font-size:clamp(20px,2.4vw,32px); color:var(--ink); margin-top:12px; letter-spacing:0; line-height:1.3; }
  #status .alt em { font-style:normal; color:var(--soft); font-weight:400; }
  #fixes .arrow { color:var(--soft); }
  #fixes .alt { color:var(--ink); }
  #counts { color:var(--soft); font-size:14px; }
</style>
</head>
<body>
<div class="bar">
  <span class="title">Up-Goer check</span>
  <span id="counts"></span>
  <label><input type="checkbox" id="lenient" checked>Accept endings (-s, -ed, -ing, -ly)</label>
  <button id="clearBtn">Clear</button>
  <span class="wrap"><button id="setBtn">Settings</button>
  <div id="panel">
    <div class="grp"><h3>Theme</h3><div class="seg" data-key="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button><button data-v="auto">Auto</button></div></div>
    <div class="grp"><h3>Highlight wrong words</h3><div class="seg" data-key="hl"><button data-v="marker">Marker</button><button data-v="underline">Wavy</button><button data-v="box">Solid</button><button data-v="color">Colour</button></div></div>
    <div class="grp"><h3>Alert tone</h3>
      <div class="row"><select id="tone"><option value="knock">Soft knock</option><option value="chime">Chime</option><option value="pop">Pop</option><option value="buzz">Low buzzer</option><option value="off">No sound</option></select><button id="testTone">Test</button></div>
      <div style="margin-top:8px"><input type="range" id="vol" min="0" max="100" value="70"></div></div>
    <div class="grp"><h3>Troubleshooting</h3><button class="pb" id="diagBtn">Check microphone and speech service</button><div id="diag"></div></div>
    <div class="grp"><h3>Suggest other words</h3><div class="seg" data-key="sug"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div class="grp"><h3>Screen flash</h3><div class="seg" data-key="flash"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
  </div></span>
</div>

<main>
  <div id="status">Ready when you are.</div>
  <button id="go">Start listening</button>
  <div id="msg"></div>
</main>

<footer>
  <div id="fixes"></div>
  <div id="transcript"></div>
  <div id="typed"><input id="typedIn" placeholder="Or type a sentence to check it"><button id="typedBtn">Check</button></div>
</footer>

const NUM = ["zero","one","two","three","four","five","six","seven","eight","nine","ten"];
const $ = id => document.getElementById(id);

function norm(t){ return t.toLowerCase().replace(/[’‘`]/g,"'").replace(/^[^a-z0-9']+|[^a-z0-9']+$/g,""); }

function baseForms(w){
  const out = [];
  const suf = [["'s",""],["s",""],["es",""],["ies","y"],["ed",""],["d",""],["ied","y"],["ing",""],["ing","e"],["ly",""],["er",""],["er","e"],["est",""],["est","e"],["ier","y"],["iest","y"]];
  for (const [s,r] of suf) if (w.length > s.length+1 && w.endsWith(s)) {
    const b = w.slice(0,-s.length)+r; out.push(b);
    if (b.length>2 && b[b.length-1]===b[b.length-2]) out.push(b.slice(0,-1));
  }
  return out;
}
function check(raw){
  const w = norm(raw);
  if (!w) return null;
  if (/^\d+$/.test(w)) { const n=+w; return (n<=10 && ALLOWED.has(NUM[n])) ? "ok" : "bad"; }
  if (ALLOWED.has(w)) return "ok";
  if ($("lenient").checked && baseForms(w).some(b => ALLOWED.has(b))) return "form";
  return "bad";
}
function tokens(text){ return text.split(/[\s—]+|-(?=\S)/).filter(t => norm(t)); }

// ---- sound: one soft, low, rounded note (like a muted wooden knock) ----
let ac;
function ctx(){ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if (ac.state==="suspended") ac.resume(); return ac; }
function tone(a, t0, type, f0, f1, dur, peak, lp){
  const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
  o.type=type; o.frequency.setValueAtTime(f0,t0); if (f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t0+dur*0.8);
  f.type="lowpass"; f.frequency.value=lp||2500;
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t0+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(f); f.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+0.02);
}
function beep(){
  const kind = S.tone, v = S.vol/100; if (kind==="off" || v===0) return;
  try {
    const a=ctx(), t=a.currentTime;
    if (kind==="knock") { tone(a,t,"sine",392,294,0.4,0.35*v,1400); tone(a,t,"triangle",196,147,0.4,0.25*v,1400); }
    else if (kind==="chime") { tone(a,t,"sine",880,880,0.7,0.22*v); tone(a,t+0.11,"sine",660,660,0.8,0.22*v); }
    else if (kind==="pop") { tone(a,t,"sine",700,180,0.16,0.5*v,3000); }
    else if (kind==="buzz") { tone(a,t,"sawtooth",110,100,0.35,0.16*v,600); }
  } catch(e){}
}

let finals = [], interim = "", beeped = {}, statusTimer;

function say(text, cls, note){
  const s = $("status"); s.className = cls||""; s.textContent = text;
  if (note) { const n=document.createElement("span"); n.className="note"; n.textContent=note; s.append(n); }
}
function suggest(raw){
  if (S.sug === "off") return [];
  const w = norm(raw);
  if (!w || /^\d+$/.test(w)) return [];
  if (SUG[w]) return SUG[w];
  for (const b of baseForms(w)) if (SUG[b]) return SUG[b];
  for (let i = 3; i <= w.length - 3; i++) {            // joined words, e.g. sunlight -> sun light
    const a = w.slice(0,i), b = w.slice(i);
    if (ALLOWED.has(a) && ALLOWED.has(b)) return [a + " " + b];
  }
  return [];
}
function flagBad(word){
  const k = norm(word);
  say(k, "flag", "isn’t on the list");
  if (S.sug !== "off") {
    const alts = suggest(k), el = document.createElement("span"); el.className = "alt";
    if (alts.length) { const em = document.createElement("em"); em.textContent = "Try: "; el.append(em, alts.join("  ·  ")); }
    else { const em = document.createElement("em"); em.textContent = "Try describing it with simpler words."; el.append(em); }
    $("status").append(el);
  }
  if (S.flash==="on") { document.body.classList.remove("hit"); void document.body.offsetWidth; document.body.classList.add("hit"); }
  beep();
  clearTimeout(statusTimer);
  statusTimer = setTimeout(()=>{ if (listening) say("Listening…","live"); }, 2600);
}

function render(){
  const tr = $("transcript"); tr.innerHTML = "";
  let nW=0, nB=0;
  const add = (text, isInterim) => {
    for (const t of tokens(text)) {
      const c = check(t); if (!c) continue;
      const sp = document.createElement("span");
      sp.className = (c==="bad"?"bad":c==="form"?"form":"") + (isInterim?" interim":"");
      sp.textContent = t; tr.append(sp, " ");
      if (c==="bad") { const s = suggest(t); if (s.length) sp.title = "Try: " + s.join("  or  "); }
      nW++; if (c==="bad") nB++;
    }
  };
  finals.forEach(f=>add(f,false)); add(interim,true);
  tr.scrollTop = tr.scrollHeight;
  $("counts").textContent = nW ? `${nW} words, ${nB} to fix` : "";
  const uniq = new Map();
  finals.forEach(f=>tokens(f).forEach(t=>{ if(check(t)==="bad"){ const k=norm(t); uniq.set(k,(uniq.get(k)||0)+1);} }));
  const fx = $("fixes"); fx.innerHTML = "";
  if (uniq.size) {
    fx.append("To fix: ");
    let first = true;
    uniq.forEach((n,k)=>{ if(!first) fx.append(", "); first=false; const b=document.createElement("b"); b.textContent = k + (n>1?" (×"+n+")":""); fx.append(b); const s=suggest(k); if (s.length) { const ar=document.createElement("span"); ar.className="arrow"; ar.textContent=" → "; const al=document.createElement("span"); al.className="alt"; al.textContent=s[0]; fx.append(ar, al); } });
  }
}
function scanForBeeps(i, text){
  const counts = {};
  tokens(text).forEach(t=>{ if (check(t)==="bad"){ const k=norm(t); counts[k]=(counts[k]||0)+1; } });
  const seen = beeped[i] = beeped[i] || {};
  for (const k in counts) {
    const extra = counts[k] - (seen[k]||0);
    for (let n=0;n<extra;n++) flagBad(k);
    if (extra>0) seen[k] = counts[k];
  }
}

async function detectBrowser(){
  const ua = navigator.userAgent;
  try { if (navigator.brave && await navigator.brave.isBrave()) return "Brave"; } catch(e){}
  if (/Edg\//.test(ua)) return "Edge";
  if (/OPR\//.test(ua)) return "Opera";
  if (/Firefox\//.test(ua)) return "Firefox";
  if (/Chrome\//.test(ua)) return "Chrome";
  if (/Safari\//.test(ua)) return "Safari";
  return "this browser";
}
function reach(url, ms){
  return new Promise(res => {
    const c = new AbortController(), t = setTimeout(()=>{ c.abort(); res(false); }, ms);
    fetch(url, { mode:"no-cors", cache:"no-store", signal:c.signal }).then(()=>{ clearTimeout(t); res(true); }, ()=>{ clearTimeout(t); res(false); });
  });
}
let diagRunning = false;

  } else if (br === "Brave") {
    add("fail", "Browser: Brave", "Brave blocks the speech service on purpose, so you will always get a network error.", "Open this page in Google Chrome or Microsoft Edge.");
  } else if (br === "Opera") {
    add("warn", "Browser: Opera", "Opera often cannot reach the speech service.", "If it fails, use Google Chrome or Microsoft Edge.");
  } else add("ok", "Browser: " + br, "Speech recognition is available.");

  if (!window.isSecureContext) add("fail", "Secure page", "This page is not served over https, so the microphone will not work or will keep asking.", "Use the https link: https://nagarajan1295.github.io/upgoer-checker/");
  else add("ok", "Secure page", location.protocol === "file:" ? "Local file" : location.host);

  // 3. internet + speech servers
  if (!navigator.onLine) add("fail", "Internet", "The computer says it is offline.", "Connect to wifi or a cable. If there is no internet, use the offline option below (Chrome 139 or newer) or the typing box.");

    const host = isEdge ? "https://speech.platform.bing.com/" : "https://www.google.com/speech-api/v2/recognize";
    const [net, svc] = await Promise.all([reach("https://www.gstatic.com/generate_204", 5000), reach(host, 6000)]);

    else add("ok", "Internet", "Connected.");
    if (svc) add("ok", "Speech service (" + (isEdge ? "Microsoft" : "Google") + ")", "Reachable.");
    else if (net) add("fail", "Speech service (" + (isEdge ? "Microsoft" : "Google") + ")", "The internet works, but this speech server is blocked or not answering. This is the usual cause of the “network” error: a firewall, school or work network, VPN, or ad blocker.",

  }

    try {
      const st = await SR.available({ langs:["en-US"], processLocally:true });
      if (st === "available") add("ok", "Offline speech (on this computer)", "Installed. It works without internet.");
      else if (st === "downloadable" || st === "downloading") add("warn", "Offline speech (on this computer)", "Not installed yet, but Chrome can download it (one time, needs internet).", "Press Start listening while online once; the download starts automatically.");
      else add("warn", "Offline speech (on this computer)", "Not available on this device.", "Needs Chrome 139 or newer on Windows or Mac.");
    } catch(e) { add("warn", "Offline speech (on this computer)", "Could not check."); }

  else if (perm === "granted") add("ok", "Microphone permission", "Allowed for this site.");
  else add("warn", "Microphone permission", perm === "prompt" ? "Not asked yet." : "Unknown.", "Click Allow if the browser asks.");

  // 6. devices + live level
  let micMsg = null;
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput");
    if (!devs.length) add("fail", "Microphone device", "No microphone found.", "Plug in or enable a microphone. Windows: Settings → System → Sound → Input.");

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, listening=false, netFails=0, useLocal=false, triedLocal=false, pending=null;

async function prepareLocal(){
  // Chrome 139+ can recognise speech on this computer, with no internet. Try that first.
  try {
    if (SR && SR.available && SR.install) {
      const opts = { langs:["en-US"], processLocally:true };
      let st = await SR.available(opts);
      if (st === "downloadable" || st === "downloading") {
        $("msg").textContent = "Downloading the offline speech pack (one time)…";
        await SR.install(opts);
        st = await SR.available(opts);
      }
      useLocal = (st === "available");
    }
  } catch(e){ useLocal = false; }
}

function startRec(){
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = "en-US"; rec.maxAlternatives = 1;
  if (useLocal) { try { rec.processLocally = true; } catch(e){} }
  rec.onstart = () => { beeped = {}; $("msg").textContent = useLocal ? "" : $("msg").textContent; };
  rec.onresult = (e) => {
    netFails = 0; $("msg").textContent = "";
    let live = "";
    for (let i=e.resultIndex; i<e.results.length; i++) {
      const r = e.results[i], text = r[0].transcript;
      scanForBeeps(i, text);
      if (r.isFinal) finals.push(text.trim()); else live += text + " ";
    }
    interim = live; render();
  };
  rec.onerror = (e) => {
    const m = $("msg");
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      m.textContent = "Microphone or speech access was refused. Opening the checker…";
      stopListening(); openDiag();
    } else if (e.error === "audio-capture") {
      m.textContent = "No working microphone found. Opening the checker…";
      stopListening(); openDiag();
    } else if (e.error === "network") {
      netFails++;
      if (useLocal) { useLocal = false; triedLocal = true; }
      else if (!triedLocal && SR.install) { triedLocal = true; m.textContent = "Speech service unreachable, trying the offline speech pack…"; pending = prepareLocal(); }
      if (netFails === 1) m.textContent = m.textContent || "Can’t reach the speech service. Retrying…";
      if (netFails === 3) { m.textContent = "Still can’t reach the speech service. Running the checker to find out why…"; openDiag(); }
      if (netFails === 8) { m.textContent = "Speech recognition isn’t working here. Use Settings → Troubleshooting, or type into the box below."; }
    } else if (e.error === "language-not-supported") {
      m.textContent = "English speech isn’t available in this browser.";
    } else if (e.error !== "no-speech" && e.error !== "aborted") {
      m.textContent = "Speech error: " + e.error + ". Settings → Troubleshooting can help.";
    }
  };
  rec.onend = () => { if (listening) setTimeout(()=>{ Promise.resolve(pending).then(()=>{ pending=null; if (listening) { try { startRec(); } catch(e){} } }); }, netFails ? Math.min(500*netFails, 3000) : 100); };
  try { rec.start(); } catch(e){}
}

function stopListening(){
  listening = false; try { rec && rec.stop(); } catch(e){}
  $("go").textContent = "Start listening"; $("go").classList.remove("on");
  say("Stopped.","");
}
$("go").onclick = async () => {
  if (listening) { stopListening(); return; }
  if (!SR) { $("msg").textContent = "This browser can’t do speech recognition. Open the page in Chrome or Edge. The typing box below still works."; return; }
  if (location.protocol === "file:") $("msg").textContent = "Tip: open this through start.bat so the browser remembers the microphone permission.";
  ctx();
  listening = true; netFails = 0;
  $("go").textContent = "Stop"; $("go").classList.add("on");
  say("Listening…","live");
  await prepareLocal();
  if (listening) startRec();
};
$("clearBtn").onclick = () => { finals=[]; interim=""; beeped={}; render(); };
$("lenient").onchange = render;

function checkTyped(){
  const v = $("typedIn").value.trim(); if (!v) return;
  ctx(); scanForBeeps("t"+Date.now(), v); finals.push(v); $("typedIn").value=""; render();
}
$("typedBtn").onclick = checkTyped;
$("typedIn").addEventListener("keydown", e=>{ if(e.key==="Enter") checkTyped(); });
applySettings();
render();
</script>
</body>
</html>
